services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"   # coordinator
      # strategy dashboards: expose the ones you use, then set AGENT_<ID>_PUBLIC_URL
      # - "3001:3001" # perp
      # - "3002:3002" # yield
      # - "3003:3003" # neutral
      # - "3004:3004" # lp
      # - "3005:3005" # dca
      # - "3006:3006" # degen
    volumes:
      - bot-data:/data

volumes:
  bot-data:
